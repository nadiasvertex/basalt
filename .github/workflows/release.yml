name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - { name: linux-x86_64, os: ubuntu-24.04, cxx: g++-14, format: tar.gz, args: "" }
          - { name: macos-arm64, os: macos-26, cxx: clang++, format: tar.gz, args: "-D CMAKE_OSX_ARCHITECTURES=arm64" }
          - { name: windows-x64, os: windows-2022, cxx: cl, format: zip, args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the project version
        run: |
          version=$(sed -nE 's/^project\(basalt VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version."
            exit 1
          fi
          echo "PACKAGE=basalt-$version-${{ matrix.platform.name }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup

      # Debug and Release share one prefix. The Debug library has a "d" suffix, and the CMake
      # package picks the matching configuration.
      - name: Build, test and install
        run: |
          for config in Debug Release; do
            cmake -S . -B .build/$config -G Ninja -C .build/sources/init.cmake \
              -D CMAKE_BUILD_TYPE=$config -D CMAKE_CXX_COMPILER=${{ matrix.platform.cxx }} \
              ${{ matrix.platform.args }}
            cmake --build .build/$config --parallel
            ctest --test-dir .build/$config --output-on-failure --no-tests=error
            cmake --install .build/$config --prefix ".build/$PACKAGE"
          done

      # pwd -W gives Git Bash on Windows a path that CMake understands.
      - name: Build tests/consumer against the package
        run: |
          prefix="$(pwd -W 2>/dev/null || pwd)/.build/$PACKAGE"
          for config in Debug Release; do
            cmake -S tests/consumer -B .build/consumer-$config -G Ninja \
              -D CMAKE_BUILD_TYPE=$config -D CMAKE_CXX_COMPILER=${{ matrix.platform.cxx }} \
              ${{ matrix.platform.args }} -D BASALT_CONSUME=package -D CMAKE_PREFIX_PATH="$prefix"
            cmake --build .build/consumer-$config
            ctest --test-dir .build/consumer-$config --output-on-failure --no-tests=error
          done

      - name: Pack
        working-directory: .build
        run: |
          if [ "${{ matrix.platform.format }}" = zip ]; then
            cmake -E tar cf "../$PACKAGE.zip" --format=zip "$PACKAGE"
          else
            cmake -E tar czf "../$PACKAGE.tar.gz" "$PACKAGE"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform.name }}
          path: ${{ env.PACKAGE }}.${{ matrix.platform.format }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum basalt-* > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "Basalt ${GITHUB_REF_NAME#v}"
          --generate-notes --verify-tag
